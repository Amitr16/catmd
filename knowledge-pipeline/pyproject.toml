[project]
name = "catmd-knowledge-pipeline"
version = "0.1.0"
description = "Build feline veterinary knowledge cards for CatMD RAG corpus"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "supabase>=2.10",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
  "rich>=13.9",
  "tiktoken>=0.8",
  "robotexclusionrulesparser>=1.7",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
